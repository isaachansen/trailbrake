name: Feedback
description: Report bugs, request widgets or sim support, or leave general feedback
title: "[Feedback] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Trailbrake. Fill in what applies — you can delete the rest.
  - type: input
    id: version
    attributes:
      label: Trailbrake version
      description: Shown in Settings → About (e.g. v0.4.2)
      placeholder: v0.0.0
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Bug report
        - Widget request
        - Sim / connector request
        - General feedback
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Details
      description: What happened, what you expected, or what you'd like to see
      placeholder: |
        **What I was doing**
        …

        **What happened / what I'd like**
        …
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Sim, widgets involved, steps to reproduce, screenshots (paste links)
      placeholder: Optional
    validations:
      required: false
